name: Public source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native fixture tools
        run: sudo apt-get update && sudo apt-get install -y mtools gdisk dosfstools e2fsprogs zstd
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/audit-public.py
      - run: python -m unittest discover -s tests
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm test
        working-directory: server
  windows-imports:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: desktop
      - name: Native Windows CLI lookup and portable imports
        run: node --test tests/import-portability.test.cjs tests/ai-tools.test.cjs tests/windows-environment.test.cjs tests/windows-native-import.test.cjs
        working-directory: desktop
