# LA AGUJA RESCUE DISK — edita este archivo, guarda y arranca. No es un script shell.
# Valores literales: no añadas comillas. Se admiten espacios, #, $ y %.
[aguja]
hostname = aguja
wifi_ssid =
wifi_password =
# wpa-psk | sae (WPA3) | open
wifi_security = wpa-psk
wifi_country = ES
wifi_hidden = no
# Contraseña de fábrica pública: aguja. Puedes poner aquí una personalizada.
# Vacío sin clave pública también usa aguja; vacío con clave pública = solo clave.
ssh_password = aguja
# Una clave pública completa, nunca la clave privada.
ssh_public_key =
ssh_port = 22
# Persiste HOME (incluidos tokens de los arneses) solo si eliges yes.
persistent_home = no
# menu | codex | antigravity | claude | opencode | shell
default_harness = menu
# Compatibilidad: full | ask. El selector al abrir un arnés siempre propone Seguro.
agent_mode = ask
