# Private per-invocation server; nothing is logged or piped to disk.
set -g exit-empty on
set -g history-limit 10000
set -g default-terminal tmux-256color
set -g mouse on
set -g mode-keys emacs
set -g status-left ' LA AGUJA '
set -g status-right 'Rueda: historial | Esc: volver '
set -g status-right-length 50
set -g status-style 'fg=colour0,bg=colour6'
set -g escape-time 25
set -g set-clipboard off
set -g allow-passthrough off
# Keep inline histories when an application toggles the alternate screen.
setw -g alternate-screen off
bind -n PPage copy-mode -u
bind -n S-PPage copy-mode -u
bind -T copy-mode PPage send-keys -X page-up
bind -T copy-mode NPage send-keys -X page-down
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode q send-keys -X cancel
# Scroll only when an application hasn't claimed the wheel itself.
bind -n WheelUpPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'
bind -n WheelDownPane send-keys -M
